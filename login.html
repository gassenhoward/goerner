<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldung | CRM Admin-Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --crm-bg-main: #f8fafc;
            --crm-card-bg: #ffffff;
            --crm-border-color: #cbd5e1;
            --crm-text-primary: #0f172a;
            --crm-text-secondary: #334155;
            --crm-accent-magenta: #e60072;
            --crm-accent-magenta-hover: #c40061;
            --crm-shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
        }

        body {
            background-color: var(--crm-bg-main);
            color: var(--crm-text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background-color: var(--crm-card-bg);
            border: 1px solid var(--crm-border-color);
            border-radius: 8px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--crm-shadow-md);
        }

        .login-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--crm-text-primary);
            margin-bottom: 1.75rem;
        }

        .text-magenta {
            color: var(--crm-accent-magenta) !important;
        }

        .form-label {
            color: var(--crm-text-secondary);
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
        }

        .form-control {
            background-color: #ffffff !important;
            border: 1px solid var(--crm-border-color) !important;
            color: var(--crm-text-primary) !important;
            font-size: 0.95rem;
            border-radius: 6px;
            padding: 0.6rem 0.85rem;
        }

        .form-control:focus {
            border-color: var(--crm-accent-magenta) !important;
            box-shadow: 0 0 0 3px rgba(230, 0, 114, 0.1) !important;
        }

        .btn-magenta {
            background-color: var(--crm-accent-magenta) !important;
            color: #ffffff !important;
            border: 1px solid var(--crm-accent-magenta) !important;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 6px;
            padding: 0.65rem 1.2rem;
            transition: all 0.15s ease;
        }

        .btn-magenta:hover {
            background-color: var(--crm-accent-magenta-hover) !important;
            border-color: var(--crm-accent-magenta-hover) !important;
        }

        .btn-magenta:disabled {
            background-color: #cbd5e1 !important;
            border-color: #cbd5e1 !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h3 class="login-title">Görner <span class="text-magenta">CRM</span> Admin</h3>
        
        <div id="alertBox" class="alert alert-danger d-none text-start small mb-3"></div>
        
        <form onsubmit="event.preventDefault(); performLogin();">
            <div class="mb-3 text-start">
                <label class="form-label" for="username">Benutzername</label>
                <input type="text" id="username" class="form-control" autocomplete="username" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label" for="password">Passwort</label>
                <input type="password" id="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" id="loginBtn" class="btn btn-magenta w-100 text-uppercase">Anmelden</button>
        </form>
    </div>

    <script>
        function performLogin() {
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value.trim();
            const ab = document.getElementById("alertBox");
            const btn = document.getElementById("loginBtn");

            ab.classList.add("d-none");

            if (!u || !p) {
                ab.textContent = "Bitte Benutzername und Passwort eingeben.";
                ab.classList.remove("d-none");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Prüfe Zugangsdaten...";

            google.script.run
                .withSuccessHandler(function(res) {
                    if (res && res.success) {
                        window.location.href = res.redirectUrl;
                    } else {
                        btn.disabled = false;
                        btn.textContent = "Anmelden";
                        ab.textContent = (res && res.message) ? res.message : "Zugangsdaten ungültig.";
                        ab.classList.remove("d-none");
                    }
                })
                .withFailureHandler(function(err) {
                    btn.disabled = false;
                    btn.textContent = "Anmelden";
                    ab.textContent = "Schnittstellen-Fehler: " + (err.message || err.toString());
                    ab.classList.remove("d-none");
                })
                .checkAuthentication(u, p);
        }
    </script>
</body>
</html>
